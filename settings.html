<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆中枢设置</title>
<style>
  :root { --bg: #1a1a2e; --card: #16213e; --border: #0f3460; --accent: #e94560; --text: #eee; --dim: #aaa; --green: #4ecca3; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 16px; line-height: 1.6; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  .card h2 { color: var(--accent); font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; margin-top: 12px; }
  input[type="text"], input[type="number"] { width: 100%; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  .hint { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
  .toggle-row label { margin: 0; }
  .status { padding: 12px; border-radius: 8px; font-size: 13px; display: none; margin-top: 12px; }
  .status.ok { display: block; background: rgba(78,204,163,0.15); color: var(--green); border: 1px solid rgba(78,204,163,0.3); }
  .status.err { display: block; background: rgba(233,69,96,0.15); color: var(--accent); border: 1px solid rgba(233,69,96,0.3); }
  .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 16px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:active { opacity: 0.8; }
  .btn-copy { background: var(--border); color: var(--text); font-size: 13px; padding: 10px; margin-top: 8px; }
  textarea { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--green); font-family: "SF Mono", Menlo, monospace; font-size: 12px; resize: vertical; min-height: 120px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .stat-item { background: var(--bg); padding: 10px; border-radius: 6px; text-align: center; }
  .stat-item .num { font-size: 24px; font-weight: 700; color: var(--green); }
  .stat-item .label { font-size: 11px; color: var(--dim); }
</style>
</head>
<body>

<!-- 卡片 1: 数据库状态 -->
<div class="card">
  <h2>📊 数据库状态</h2>
  <div class="stat-grid">
    <div class="stat-item"><div class="num" id="stat_memories">-</div><div class="label">活跃记忆</div></div>
    <div class="stat-item"><div class="num" id="stat_pitfalls">-</div><div class="label">踩坑记录</div></div>
  </div>
  <div id="db_status" class="status"></div>
</div>

<!-- 卡片 2: 核心配置 -->
<div class="card">
  <h2>⚙️ 核心配置</h2>
  <label>NCB 数据库实例名</label>
  <input type="text" id="opt_ncb_instance" value="41694_agent_memory">

  <div class="row">
    <div>
      <label>最大注入条数</label>
      <input type="number" id="opt_max_inject" value="5" min="1" max="20">
    </div>
    <div>
      <label>注入预算 (字符)</label>
      <input type="number" id="opt_max_budget" value="2048" min="256" max="8192">
    </div>
  </div>

  <label>提取模型 (留空=不自动提取)</label>
  <input type="text" id="opt_extractor_model" placeholder="如 group/clef 或 deepseek-chat">
  <div class="hint">用于从对话中自动提取记忆的 LLM 模型。留空则仅通过 MCP 手动写入。</div>
</div>

<!-- 卡片 3: MCP 配置 -->
<div class="card">
  <h2>🔌 MCP 端点配置</h2>
  <label>挂载路径</label>
  <input type="text" id="opt_mcp_path" placeholder="输入任意自定义路径，如 /agent_memory">
  <div class="hint">自动在结尾追加 <code>/mcp</code>，例如输入 <code>/test</code> → 实际路径 <code>域名/test/mcp</code></div>

  <label>MCP 配置 (给 AI 客户端用)</label>
  <textarea id="mcp_config" readonly></textarea>
  <button class="btn btn-copy" id="btn_copy_config">📋 复制 MCP 配置</button>
</div>

<!-- 底部保存按钮 -->
<button class="btn btn-primary" id="btn_save">💾 保存全部配置</button>
<div id="save_status" class="status"></div>

<script src="_magpie/bridge.js"></script>
<script src="settings.js" defer></script>
</body>
</html>
